[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "commerce-platform"
version = "1.0.0"
description = "Medium-to-large Python commerce platform for Testmon metric validation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-testmon>=2.0.0",
    "coverage>=7.3.0",
    "radon>=6.0.0",
    "lizard>=1.17.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
