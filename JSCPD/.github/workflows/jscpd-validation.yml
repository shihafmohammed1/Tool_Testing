name: JSCPD Metrics Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-duplication:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Export TESTABLE platform jscpd.json
        run: npm run export:testable

      - name: Validate TESTABLE gate (expect 100/100)
        run: npm run validate:gate

      - name: Upload metrics report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jscpd-metrics-report
          path: |
            reports/
            jscpd/0/jscpd.json
