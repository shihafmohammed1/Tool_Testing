name: Mutation Testing (Cosmic Ray)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  mutation-testing:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure clean source before mutation
        run: python scripts/restore_source.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pytest baseline
        run: python -m pytest tests -q

      - name: Cosmic Ray baseline
        run: cosmic-ray baseline cosmic-ray.toml

      - name: Initialize mutation session
        run: cosmic-ray init cosmic-ray.toml session.sqlite --force

      - name: Execute mutations
        run: cosmic-ray exec cosmic-ray.toml session.sqlite

      - name: Restore source after mutation run
        run: |
          python scripts/restore_source.py
          git diff --exit-code src/testable_demo/

      - name: Export TESTABLE platform JSON and reports
        run: python scripts/export_testable_cosmic_ray.py --fail-on-gate

      - name: Validate 100/100 mutation score gate
        run: python scripts/validate_metrics_gate.py --require-100

      - name: Verify platform JSON exists
        run: test -f cosmic-ray/0/cosmic_ray.json

      - name: Assert zero surviving mutants
        run: |
          SURVIVED=$(cr-report session.sqlite --surviving-only 2>&1 | grep -c "SURVIVED" || true)
          echo "Surviving mutants: $SURVIVED"
          test "$SURVIVED" -eq 0

      - name: Upload metrics artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-metrics-report
          path: |
            reports/metrics-report.json
            reports/metrics-report.md
            reports/mutation-score-gate.json
            cosmic-ray/0/cosmic_ray.json
            cosmic-ray/0/cosmic_ray_dump.jsonl
          retention-days: 30

      - name: Print summary
        if: always()
        run: |
          cr-rate session.sqlite
          echo "--- Surviving mutants ---"
          cr-report session.sqlite --surviving-only || true
